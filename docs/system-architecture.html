const NS = 'http://www.w3.org/2000/svg';
const svg = document.getElementById('d');
const MONO = 'Consolas, "JetBrains Mono", "Courier New", monospace';
const SANS = 'Inter, "Segoe UI", system-ui, sans-serif';

function el(tag, attrs, parent = svg) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  parent.appendChild(e);
  return e;
}
function txt(x, y, s, o = {}, parent = svg) {
  const t = el('text', {
    x, y, 'font-size': o.size || 10, 'font-family': o.mono ? MONO : SANS,
    'font-weight': o.weight || 400, fill: o.fill || '#1e293b',
    'text-anchor': o.anchor || 'start'
  }, parent);
  if (o.halo) { t.setAttribute('stroke', '#fff'); t.setAttribute('stroke-width', 3);
    t.setAttribute('paint-order', 'stroke'); t.setAttribute('stroke-linejoin', 'round'); }
  t.textContent = s;
  return t;
}

/* ---------- colours per flow type ---------- */
const FLOW = {
  api:    { c: '#2563eb', label: 'Client → API (HTTPS REST/JSON, :3001/api)' },
  local:  { c: '#0d9488', label: 'In-browser call (no network)' },
  call:   { c: '#334155', label: 'Server-side call (route → service)' },
  db:     { c: '#16a34a', label: 'Database (SQL over TLS :5432)' },
  ai:     { c: '#7c3aed', label: 'Third-party API (Groq, OSM, CDN · HTTPS)' },
  notify: { c: '#ea580c', label: 'To people/devices (invite, SMTP, tel:, links)' },
  ws:     { c: '#2563eb', dash: '5 4', label: 'Realtime push (Socket.IO WebSocket)' },
  deploy: { c: '#64748b', dash: '7 5', label: 'Build & deployment' },
  error:  { c: '#dc2626', dash: '4 3', label: 'Error / fallback path' }
};
const defs = el('defs', {});
for (const k in FLOW) {
  const m = el('marker', { id: 'm-' + k, markerWidth: 8, markerHeight: 8, refX: 7.5, refY: 4,
    orient: 'auto', markerUnits: 'userSpaceOnUse' }, defs);
  el('path', { d: 'M0,0 L8,4 L0,8 z', fill: FLOW[k].c }, m);
}

/* ---------- building blocks ---------- */
function zone(n, title, x, y, w, h, fill, stroke) {
  el('rect', { x, y, width: w, height: h, rx: 14, fill, stroke, 'stroke-width': 1.6, 'stroke-dasharray': '8 5' });
  txt(x + 12, y + 17, `${n}. ${title}`, { size: 13, weight: 700, fill: stroke });
}
function band(x, y, w, h, title, line, fill = '#ffffff', stroke = '#94a3b8') {
  el('rect', { x, y, width: w, height: h, rx: 8, fill, stroke, 'stroke-width': 1 });
  txt(x + 10, y + 16, title, { size: 10.5, weight: 700 });
  txt(x + 10, y + 31, line, { size: 9.2, mono: true, fill: '#334155' });
}
function stage(x, y, s) { txt(x, y, s, { size: 9, weight: 700, fill: '#64748b' }); }

const DIA = { g: '#16a34a', a: '#d97706', r: '#dc2626' };
function card(o) {
  const { x, y, w, h } = o;
  el('rect', { x, y, width: w, height: h, rx: 8, fill: o.fill || '#ffffff',
    stroke: o.stroke || '#cbd5e1', 'stroke-width': 1 });
  el('circle', { cx: x + 15, cy: y + 16, r: 10.5, fill: o.ib || '#e2e8f0' });
  txt(x + 15, y + 20, o.icon || '•', { size: o.iconSize || 11, anchor: 'middle', weight: 700, fill: o.ic || '#0f172a' });
  txt(x + 31, y + 20, o.title, { size: 11.5, weight: 700, fill: '#0f172a' });
  const files = [].concat(o.file || []);
  files.forEach((f, i) => txt(x + 31, y + 33 + i * 11, f, { size: 9, mono: true, fill: '#475569' }));
  let ly = y + 35 + files.length * 11;
  for (const raw of (o.lines || [])) {
    let s = raw, tx = x + 10, fill = '#1e293b';
    const m = /^◇([gar]) /.exec(s);
    if (m) {
      const cx = x + 14, cy = ly - 3.5;
      el('polygon', { points: `${cx},${cy - 5} ${cx + 5},${cy} ${cx},${cy + 5} ${cx - 5},${cy}`, fill: DIA[m[1]] });
      s = s.slice(3); tx = x + 23; fill = DIA[m[1]];
    }
    txt(tx, ly, s, { size: 9.3, mono: !!o.mono, fill });
    ly += 12;
  }
}
function badge(x, y, n, c) {
  const r = String(n).length > 1 ? 8.5 : 7.5;
  el('circle', { cx: x, cy: y, r, fill: c, stroke: '#fff', 'stroke-width': 1.5 });
  txt(x, y + 3.2, n, { size: String(n).length > 2 ? 7.2 : 8.6, weight: 700, fill: '#fff', anchor: 'middle' });
}
function arrow(pts, type, o = {}) {
  const f = FLOW[type];
  const d = pts.map((p, i) => (i ? 'L' : 'M') + p[0] + ',' + p[1]).join(' ');
  const a = { d, fill: 'none', stroke: f.c, 'stroke-width': 1.7, 'marker-end': `url(#m-${type})` };
  if (f.dash) a['stroke-dasharray'] = f.dash;
  el('path', a);
  let ty = o.tp ? o.tp[1] : 0;
  if (o.n) {
    const s = o.seg || 0, p = pts[s], q = pts[s + 1];
    const b = o.b || [(p[0] + q[0]) / 2, (p[1] + q[1]) / 2];
    badge(b[0], b[1], o.n, f.c);
    // keep a label that sits above the badge clear of it
    if (o.tp && Math.abs(o.tp[0] - b[0]) < 60 && ty < b[1] && ty > b[1] - 12) ty = b[1] - 12;
  }
  if (o.t) {
    [].concat(o.t).forEach((line, i) =>
      txt(o.tp[0], ty + i * 10, line, { size: 8.6, weight: 600, fill: f.c, anchor: o.anchor || 'middle', halo: true }));
  }
}
