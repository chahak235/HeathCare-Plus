# Render Blueprint: Dashboard → New → Blueprint → pick this repo.
# Secret values (sync: false) are typed into the Render dashboard, never into git.
services:
  - type: web
    name: healthcare-plus-api
    runtime: node
    rootDir: backend
    plan: free
    region: singapore
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      # Encrypts health fields at rest. Must be the SAME value as backend/.env
      - key: DATA_ENCRYPTION_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: GROQ_API_KEY
        sync: false
      # Render's free plan blocks SMTP ports, so mail goes out through the Gmail API
      - key: EMAIL_TRANSPORT
        value: gmail-api
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_PLATFORM_REFRESH_TOKEN
        sync: false
      # Skin model service (skin-model-service/, e.g. a Hugging Face Space)
      - key: SKIN_MODEL_URL
        sync: false
      - key: SKIN_SERVICE_KEY
        sync: false
      - key: APPOINTMENT_AUTO_CONFIRM
        value: "true"
      - key: MAX_BOOKING_DAYS
        value: "90"
      - key: CLINIC_UTC_OFFSET_MINUTES
        value: "330"
